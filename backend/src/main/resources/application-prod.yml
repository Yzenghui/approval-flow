# 生产环境：激活 prod 时生效
# 连接信息全部来自环境变量，无默认值，缺变量则启动失败
# 示例：
#   SPRING_PROFILES_ACTIVE=prod \
#   MYSQL_HOST=10.0.0.12 MYSQL_USERNAME=app_flow MYSQL_PASSWORD=*** \
#   REDIS_HOST=10.0.0.13 REDIS_PASSWORD=*** \
#   ROCKETMQ_NAME_SERVER=10.0.0.14:9876 \
#   java -jar approval-flow-backend.jar

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:approval_flow}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl    # 生产关闭 SQL 打印

logging:
  level:
    com.approval: info
