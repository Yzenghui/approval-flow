# 公共配置：与部署环境无关的部分，所有环境共享
# 连接地址与凭据、日志级别等环境相关配置见 application-{profile}.yml
# 默认激活 dev（本地），生产由环境变量 SPRING_PROFILES_ACTIVE=prod 指定

spring:
  application:
    name: approval-flow-backend

  profiles:
    active: dev

# Sa-Token
sa-token:
  token-name: Authorization
  timeout: 86400                   # Token 有效期（秒）
  active-timeout: -1               # -1 表示不限制最低活跃频率
  is-concurrent: true              # 允许多地同时登录
  is-share: true                   # 多设备共用一个 Token，一处登出全部下线
  token-style: uuid
  is-log: false

# Tomcat MBean 注册：开启后 Micrometer 才能通过 JMX 采集 tomcat.threads.* 指标
server:
  tomcat:
    mbeanregistry:
      enabled: true

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true

# RocketMQ
rocketmq:
  producer-group: approval-producer
  consumer-group: approval-consumer
  send-msg-timeout: 3000
  consume-message-batch-max-size: 1
  max-reconsume-times: 5           # 超出后进入死信队列

# 本地消息表扫表任务
mq:
  outbox:
    enabled: true                  # false 时不注册扫表任务
    scan-interval-ms: 5000         # 扫表间隔，压测提速时可调小

# Spring Boot Actuator：暴露 health / info / prometheus 端点供运维与压测观测使用
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always         # 暴露健康检查明细，方便排障
  metrics:
    tags:
      application: ${spring.application.name}   # 给所有指标打 application 标签，便于按服务聚合
    enable:
      tomcat: true                 # Tomcat 线程池指标
    distribution:
      percentiles-histogram:
        http.server.requests: true # 暴露 http_server_requests_seconds_bucket，供 p95/p99 直方图计算
